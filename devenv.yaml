# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

# If you're using non-OSS software, you can set allow_unfree to true.
# allow_unfree: true

# If you're not willing to allow unsupported packages:
# allow_unsupported_system: false

# If you're willing to use a package that's vulnerable
# permitted_insecure_packages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend

# secretspec holds only the OPERATOR-SUPPLIED peppers. The generated
# interserver credential stays in conf/import/ and the database password lives
# in DEVENV_STATE; neither needs a secret manager.
#
# Provider is age: gitignored secrets.age is included in encrypted settings
# backups and unreadable without the private key in
# ~/.config/secretspec/age-identity.txt. Back that key up separately.
# NOTE: devenv's own integration is deliberately off. It resolves secrets while
# constructing the shell, before `packages` are on PATH, so a provider needing
# a binary cannot find it. rathena-db-init calls the secretspec CLI itself,
# where the devenv environment is fully available.
secretspec:
  enable: false
