[project]
name = "rathena"
revision = "1.0"

# Operator-supplied secrets only. Machine-generated ones (interserver
# credentials, database password) are written straight into conf/import/ by
# tools/rathena-secrets.py and are not declared here.
#
# Provider is age://secrets.age. The file is committed: it is unreadable
# without the private key in ~/.config/secretspec/age-identity.txt, so the
# values survive a lost machine while staying out of reach.
#
# BACK THAT KEY UP SEPARATELY. Losing it means every account must be reset.
#
#   age-keygen -o ~/.config/secretspec/age-identity.txt
#
#   secretspec set RATHENA_HASH_PEPPER
#   secretspec check

[profiles.default]
RATHENA_HASH_PEPPER = { description = "Server-side pepper mixed into every password hash. NEVER rotate: it invalidates every account. Losing it means every password must be reset.", required = false }
RATHENA_WIRE_PEPPER = { description = "Fixed <passwordencrypt> key (password_pepper). Not secret - the server hands it to any caller - but deployment-specific.", required = false }
